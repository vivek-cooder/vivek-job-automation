<!doctype html>
<html><head><title>Job Application</title></head><body>
  <h1>Frontend Developer Application</h1>
  <form id="jobApplication">
    <label>Full Name <input name="full_name"></label>
    <label>Email <input name="email" type="email"></label>
    <label>Phone <input name="phone" type="tel"></label>
    <label>Resume <input name="resume" type="file"></label>
    <label>Expected Salary <input name="expected_salary" required></label>
    <label>Work Authorization <input name="work_authorization" required></label>
    <label>Why do you want this role? <input name="unknown_question" required></label>
    <button type="button">Submit Application</button>
  </form>
</body></html>
