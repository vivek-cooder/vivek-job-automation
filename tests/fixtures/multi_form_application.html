<!doctype html>
<html><head><title>Careers</title></head><body>
  <h1>React Developer Application</h1>
  <form id="newsletter"><h2>Newsletter</h2>
    <label>Email <input name="newsletter_email" type="email"></label>
    <button type="submit">Subscribe</button>
  </form>
  <form id="contact"><h2>Contact Us</h2>
    <label>Name <input name="contact_name"></label>
    <label>Email <input name="contact_email" type="email"></label>
    <label>Phone <input name="contact_phone" type="tel"></label>
    <button type="submit">Send message</button>
  </form>
  <form id="search"><h2>Search</h2><input type="search" name="q"></form>
  <form id="jobApplication" action="/jobs/application">
    <h2>Job Application</h2>
    <label>Full Name <input name="full_name"></label>
    <label>Email <input name="applicant_email" type="email"></label>
    <label>Phone <input name="phone" type="tel"></label>
    <button type="button">Submit Application</button>
  </form>
</body></html>
